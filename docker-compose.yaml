version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school
    ports:
      - "5432:5432"
    volumes:
      - data_store:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d school"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: school_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      PORT: 8080
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: school
      DB_USER: admin
      DB_PASSWORD: password
    ports:
      - "8080:8080"

volumes:
  data_store:
